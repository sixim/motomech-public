        source: |
          B｜Haynes 4•2。**这一页的标签列与数值列在照片上错开一行**（页面轻微旋转）。
          映射不是靠肉眼水平对齐定的，用了两重独立校验：
            ① 跟引导点线：把「Fork air bleed screw」那两行切成极窄带放大，
