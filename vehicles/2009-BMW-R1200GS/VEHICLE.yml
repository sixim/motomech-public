    level: C
    note: "同上"

  # ── 身份本身待核实的项 ──
  - item: spark_plug.secondary_type_and_count
    candidate: "推测 2 主 + 2 副 = 4 支；副塞型号未知"
    level: C
    note: "Haynes p1•1 只列了一个型号（Bosch YR5LDE / NGK DCPR 8 EKC），
           但 p43 明确有主塞与副塞两组、且副塞线圈分左右手。
           **已拍页面没说副塞用什么型号、也没说哪些年份有副塞。**
           解法不必等书：P2 本来就要拆塞，拆下来的旧塞上印着型号，当场就知道。
           在此之前只订主塞，副塞看到再补（3 天到货，不卡进度）"
