    candidate: "BMS-K"
    level: C
    note: "hexhead 用 BMS-K、camhead 用 BMS-K+。影响诊断设备与故障码字典"
  - item: abs_variant
    candidate: "Integral ABS 非助力型"
    level: C
    note: "2004-06 为助力式（servo），2007 起取消。2009 应为非助力，须核实 —— 两者排气与复活流程完全不同"

  # ── 原有待核实项（部分因车型订正而改变）──
  - item: torque.chassis_full_table
    candidate: ~
    level: 无
    note: |
      Haynes 4•2（PDF p153）「Torque settings (continued)」是一整页底盘/悬挂扭力表
      （车把夹持、前叉、转向头、终传枢轴、前后减震…），**尚未采集**。
      按年份分档：车把夹持 GS 2004-2007 与 **2008-on** 是不同值，本车取后者。

      为什么不一次抄完：该页在照片上有轻微倾斜，引导点线与数值列的对齐不可靠。
      本项目已栽过一次 —— 低分辨率下把 56 Nm 读成 50 Nm。
      二十多个值批量转录 = 批量制造风险。**要用哪条就单独放大核对哪条。**
  - item: torque.rear_shock_lower_mounting_nm
    candidate: "初 50 / 终 20（Haynes 4•2）—— **终值低于初值，反常**"
    level: C
    note: |
      按数条目法映射得到「Initial setting 50 Nm / Final setting 20 Nm」，
      但终紧扭力低于初紧扭力不合常理（多数序列是初紧后加大到终值）。
      结构校验过了，语义没过 —— 两重校验不一致时不收。
      **用之前单独把这两行切窄带放大核一次。**
  - item: brake_specs_5_1
    candidate: ~
    level: 无
    note: |
      第 5 章制动规格页（5•1，PDF p183）**左标签列被扫描裁掉了**，
      值读得出（4.5/4.0mm、320/305mm、DOT4、盘最小厚度等）但配不上标签。
      制动是安全关键，配不上就不入库。
      —— 唯一一页有取景问题的。补拍时确保左边距完整（左侧标签不能出框）。
  - item: vehicle.curb_weight_kg
    candidate: ~
    level: C
    note: "整备质量。安全门禁的举升规则引用它。查 Haynes 04-09 规格页"
  - item: torque_values
    candidate: ~
    level: C
    note: "✅ 转机：此前归档在「参考-非本车型」的 2005 hexhead 扭力表，**现在属于本车代际**。仍须与 Haynes 04-09 交叉验证后才可升级"
  - item: oil_filter_pn
    candidate: ~
    level: 无
    note: "⚠️ 搜到的 11427721779 是水冷 LC 件号。现可凭 VIN YOUR_VIN_HERE 在 RealOEM/MAX BMW fiche 查 A 级件号"
  - item: air_filter_pn
    candidate: ~
    level: 无
    note: "⚠️ 13727726799 同为 LC 件号。同上，凭 VIN 查"
  - item: drain_plug_washer_pn
    candidate: ~
    level: 无
    note: "换机油必备，容易漏买。凭 VIN 查 fiche"

# ── 本车专有的作业项（按阶段并入通用流程）─────────────
#
# 为什么放这里而不是流程文件里：流程是跨车型骨架，
# 把某台车的召回写进去，另一台车就会收到别人的召回作业项 ——
# 2026-09-14 监工实测，哈雷确实收到了这三条 BMW 召回，还带 A 级徽章。
# **隔离要靠结构，不能靠记得过滤。**
phase_tasks:
  P1:
    - id: throttle_plastic
      name: "⚠️ 节气门拉线塑料轮检查"
      detail: "NHTSA 2009 投诉原话：塑料拉线轮开裂，毫无预兆彻底失效导致完全失去动力。侧光拍裂纹"
      source: "NHTSA 2009 投诉 A 级"
    - id: brake_line_recall
      name: "⚠️ 前刹车油管（召回 10V276000）"
      detail: "2007–2009 专有。走线受振动应力→开裂漏油→**前刹车失效**。BMW 免费换带护套新管。报 VIN 查执行状态"
      source: "NHTSA 召回 A 级"
    - id: rear_flange
      name: "⚠️ 后轮法兰（召回 15V141000）"
      detail: "铝制法兰开裂→后轮可能脱落。BMW 免费换钢件。**骑行前必须确认执行状态**"
      source: "NHTSA 召回 A 级"
  P3:
    - id: fuel_gauge_check
      name: "⚠️ 燃油表读数核对"
      detail: "fuel strip 是本车最高频故障，且 2010 之后才改浮子式。通电后把仪表读数与实际油量对一下"
      source: "NHTSA 2009 投诉 A 级"
  P5:
    - id: final_drive_metal
      name: "⚠️ 终传油查金属屑"
      detail: "2009 多起终传轴承失效（行驶中脱开）。用白色容器接，铺白纸过滤看残留 —— 这是不拆开唯一能拿到的证据"
      source: "NHTSA 2009 投诉 A 级"
      # 本步要用的规格,值由程序现查 specs_usable,不在此硬编
      specs:
        - final_drive_oil.capacity_l       # 加油量,少 40ml 正是本车故障模式
        - torque.final_drive_oil_plugs_nm  # 放/加油螺塞扭力

# ── 作业规程（跨车型有效的安全约定）──
work_rules:
  - id: torque-nm-only
    rule: "所有扭力值一律以 Nm 为准，不做 ft-lb 换算。BMW 曾印错换算值，且被 Clymer/Haynes 沿用"

# ── 研究状态 ────────────────────────────────────────
# 「查过了，没有」与「从来没查过」是两件事，空列表分不出来。
# 这两个日期就是用来分的：没有日期 = 没查过，工作台会大声提示。
recalls_checked_at: 2026-09-14        # NHTSA recallsByVehicle，两种车型写法都查过
known_issues_checked_at: 2026-09-14   # NHTSA complaintsByVehicle，30 条去重

# ── 未执行的召回（NHTSA 官方，A 级）──────────────────
# 2026-09-14 按 modelYear=2009 重新查询。与 2010 的清单**不同**。
open_recalls:
  - id: 10V276000
    component: 前刹车油管
    severity: critical
    note: "⚠️ **2009 专有，按 2010 查时完全没出现**。2007–2009 R1200/K1200，2006-08~2009-05 生产。
           走线受振动应力→油管开裂漏油→**前刹车失效**。BMW 免费换带护套新油管。卡 Phase 6/9"
  - id: 15V141000
    component: 后轮安装法兰
    severity: critical
    note: "2005-2010 R1200GS。法兰开裂→螺栓松动→**后轮可能脱落**。BMW 免费换钢制法兰。卡 Phase 7/9"
  - id: 13V617000
    component: 燃油泵法兰
    severity: critical
    note: "2005-2011 R 系。开裂漏油→起火风险。卡 Phase 4"
  - id: 20V471000
    component: 燃油泵（13V617 后续）
    severity: critical
    note: "含 2005-2011 R1200 GS。针对「已按 13V-617 装过支撑环但未换泵」的车。停放期间必然未执行。卡 Phase 4"
  - id: 17E052000
    component: 选装转向灯
    severity: minor
    note: "仅当装有 BMW 选装转向灯"

# ── 已知故障（A 级 = NHTSA 官方投诉库/召回）──────────
# 2026-09-14 按 modelYear=2009 重建。2009 有 30 条投诉（2010 仅 8 条）。
known_issues:
  - level: A
    item: 燃油液位传感器(fuel strip)失效
    symptoms: ["燃油表乱跳", "燃油表读数不准", "以为有油却熄火", "油量警告灯乱亮"]
    complaints: 11
    note: "2009 投诉里的绝对主模式。原话「FUEL GAUGE... I RAN OUT OF GAS ON A FREEWAY DURING RUSH HOUR」、
           「REPLACED 4 TIMES」。**换新后仍会再坏**。
           有投诉明载「POST 2010 MODELS CHANGED TO FLOAT TYPE SYSTEM」——
           即本车用的正是易坏的感应条式，2010 之后才改浮子式。**本车比 2010 更严重**"
  - level: A
    item: 燃油泵法兰开裂漏油并起火
    symptoms: ["漏油", "闻到汽油味", "油箱下方渗油", "起火"]
    complaints: 5
    note: "2009 投诉中有**两起实际起火**：「spraying fuel onto the hot engine and exhaust pipes
           causing the Motorcycle to catch on fire」、「did start on fire causing much burn damage」。
           与召回 13V617000 / 20V471000 互相印证。**P4 燃油作业按已失效对待**"
  - level: A
    item: 终传(final drive)失效
    symptoms: ["后轮异响", "行驶中后部摆动", "后面在晃", "后轮晃", "终传渗油", "换油见金属屑"]
    complaints: 12
    diag_tree: final-drive
    note: "⚠️ **此前写反了**：旧档案称「2010 后改善，本车属改善后批次」——本车是 2009，正在受影响批次内。
           2009 投诉多起：「FINAL DRIVE BEARING BECAME SEPARATED」(60mph 行驶中)、
           「CROWN BEARING FAILURE」、「黑油甩满后轮」、「终传油里有金属屑」。
           **P5 放终传油时必须查金属屑，P7 必须检查终传轴承旷量**"
  - level: A
    item: 节气门拉线塑料轮开裂
    symptoms: ["突然失去动力", "无预兆熄火", "油门无响应"]
    complaints: 3
    note: "⚠️ **此前归因写错了**：旧档案称「camhead 特有，hexhead 是金属件」。
           2009 投诉原话「Throttle cable pulleys made of plastic have cracks.
           Catastrophic failure will eventually occur with zero warning, causing total loss of power」。
           本车同样受影响。P1 必须侧光检查"
  - level: A
    item: 行驶中突然失去动力
    symptoms: ["突然失去动力", "加速时熄火", "高速掉速", "没劲", "突然没劲", "动力消失", "跑着跑着没力"]
    complaints: 6
    note: "多条 2009 投诉：高速超车时突然失去动力、3 挡加速时失去动力并熄火。
           与燃油系统问题可能同源，也可能独立。P8/P9 留意"
  - level: C
    item: 悬挂漏油
    symptoms: ["前叉渗油", "后减震渗油", "悬挂发软"]
    complaints: 2
    note: "「MANY MOTORCYCLE COMPLAINT ON SUSPENSION LEAKING PROBLEMS, WITH VERY LOW MILES」。
           P7 前叉与后减震按可能已渗漏对待，压下去看阻尼与油迹"
  - level: C
    item: 燃油泵控制器(FPC)腐蚀
    note: "安装位置积水导致腐蚀，十年停放后大概率有问题。沿用自旧档案，未在 2009 投诉中单独出现"
  - level: C
    item: 进气橡胶套老化开裂
    note: "导致怠速不稳和空气计量错误。停放车高频故障"

vlog_path: ~                          # 纪录片 Vlog 目录（个人功能，公开版留空）
