# 2009 BMW R1200GS — 适用性真相源
#
# ⚠️ 所有知识检索、零件采购、规格查询都必须先过这个过滤器。
#    这不是形式主义：hexhead 用了 camhead 的扭力值 = 滑牙的缸体。
#
# ══════════════════════════════════════════════════════════════
# 2026-09-14 重大订正：本车是 2009 hexhead，不是 2010 camhead
#
# 起因：车主提供 VIN YOUR_VIN_HERE。
# NHTSA 官方解码器（A 级）返回 ModelYear=2009 / Series=K25 / EngineHP=104，
# 且「Check Digit is correct」—— VIN 校验位通过，不是录入错误。
# 104 hp 对应 hexhead；camhead(2010+) 是 110 hp。
# 车主同时提供了 Haynes《BMW 04-09 R1200 Twins》PDF，独立印证同一结论。
#
# 后果（必须全部处理，否则整个平台建在错的地基上）：
#   1. 适用性排除项**整体反转** —— 此前排除 hexhead，现在要排除 camhead/LC
#   2. 此前归档在「参考-非本车型」的 hexhead 扭力表，**现在才是本车资料**
#   3. 此前当作 A 级的《BMW_Riders_Manual_R1200GS_2010》**不是本车手册** ——
#      由它得出的 16 条 A 级规格全部降级为待核实（见 specs_pending）
#   4. 召回清单变了：2009 多一条 10V276000（前刹车管，致命级）
#   5. 故障模式重建：2009 有 30 条 NHTSA 投诉（2010 只有 8 条），主模式不同
#
# 教训：适用性过滤只能保证「资料对得上车辆档案」，
#       保证不了「车辆档案对得上真车」。**身份要从 VIN 起，不从人的印象起。**
# ══════════════════════════════════════════════════════════════

id: 2009-BMW-R1200GS
make: BMW
model: R1200GS
year: 2009
nickname: ~                      # 车辆昵称（可选）

# ── 身份标识（决定所有资料选型）────────────────────
engine_code: hexhead            # SOHC，2004–2009。**不是 camhead(2010+ DOHC)**
engine_type: air-oil-cooled     # 风冷/油冷。不是水冷 LC
displacement_cc: 1170
power_hp: 104                   # A｜NHTSA VIN 解码器
model_code: K25                 # A｜NHTSA VIN 解码器
ecu: BMS-K                      # ⚠️ 待核实：hexhead 用 BMS-K，camhead 才是 BMS-K+。见 specs_pending#ecu_variant
diag_port: 10-pin-round         # 座垫下/电池仓。不是 OBD-II
abs: Integral-ABS-non-servo     # ⚠️ 待核实：2007 起取消助力泵，2009 应属非助力型。见 specs_pending#abs_variant
electrical: single-wire-CAN
fuses: electronic               # ZFE 电子保险丝，没有传统保险丝盒
ignition: twin-spark            # B｜Haynes 4598 有「primary / secondary spark plug」专章(p43)
                                # ⚠️ 副塞型号是否与主塞相同，已拍页面未载 —— 见 specs_pending
final_drive: shaft

vin: YOUR_VIN_HERE          # A｜车主提供，NHTSA 解码校验位通过
mileage: ~                      # 待采集
production_date: ~              # 待采集（铭牌）

# ── 硬性排除：命中任何一条的资料一律不适用 ──────────
# ⚠️ 必须中英文都列：本项目文件名以中文为主，只写英文词会整片漏判
# ⚠️ 2026-09-14 整体反转 —— 此前排除的 hexhead 正是本车
applicability_excludes:
  - camhead
  - 凸轮头
  - DOHC
  - "R1200GS 2010-2012"
  - "R1200GS 2010"
  - LC                          # 2013+ 水冷，件号和结构都不同
  - GSLC
  - wethead
  - 水冷头
  - "R1200GS 2013-2018"
  - water-cooled
  - 水冷
  - 液冷
  - servo-ABS                   # 2004-06 的助力 ABS，2009 已取消，复活流程不同
  - 助力ABS

# 已知的踩坑记录：搜到的机油滤 11427721779 / 空滤 13727726799
# 标注适用 "2013-2018 / R1200-1250LC"，那是水冷件号，本车不适用。

# ── 项目硬红线（顺序不可调换，违反会毁件）──────────
hard_rules:
  - id: no-crank-first
    rule: "不能直接打火。十年的汽油已变质成胶质，会把胶质泵进喷油嘴"
  - id: hand-turn-before-starter
    rule: "上起动机前必须手动盘车确认能自由转动。boxer 水平缸油膜早已流失，缸壁可能锈蚀"
  - id: battery-before-scan
    rule: "必须先装新电池再读故障码。CAN-bus 车亏电会吐出大量假故障码"

