# 电路图索引（D3）
#
# ── 为什么需要这张表 ──────────────────────────────────────────
# 电路图页**几乎不进全文检索**：它们是图，OCR 只能捞到零散标签。
# 实测：用「wiring」检索 haynes-4598，命中 p261–288 的次数 = **0**。
# 也就是说 28 页彩色电路图对 app 是隐形的 —— 有等于没有。
#
# ── 更要命的一点：电路图**按年份分档** ────────────────────────
# 同一台 GS，2004–2006 / 2007 / 2008-on 是三套**不同**的图。
# 用错档 → 照着图去背刺插头、量电压，量的是另一代车的线。
# 这正是本项目栽过的那类错（2009 hexhead 当成 2010 camhead），
# 现在出现在电路图上，而且后果更直接：会伤人或烧件。
#
# 本车 2009 GS → **只有 7•35–7•37（PDF p267–269）适用**。
#
# ── 这张表是什么、不是什么 ────────────────────────────────────
# 是**定位器**：告诉你哪一页画的是哪个系统、适用哪些年份。
# **不是数据**：线色、端子号、线径一律以页图为准，本表不复述任何数值 ——
# 复述就会和原图脱节，而人只会读复述的那份。
#
# 图注由 2026-09-16 逐页核读得出（OCR 抽到 14 条，其余裁图注条转正人工读）。
# 每条都带页号，可自行打开 pages/pNNN.jpg 核对。

# ⚠️ make 是**第一道闸**,不是装饰。
# 2026-09-19 监工实测:没有厂牌闸时,「SPO**RT**STER」含 "RT",
# 于是一台哈雷 Sportster 拿到了 BMW R1200 RT 的三页电路图,还标着「✅ 适用本车」。
# 车系名做子串匹配从根上就不安全 —— 厂牌不同的车,压根不该进入车系比较。
make: BMW

manual: haynes-4598
source_level: B          # 图本身是 Haynes（B 级）；本表只是索引
rotation: 90             # 图是横向印在竖页上，看之前转 90°
# ⚠️ 2026-09-19 边界测试抓到的自造错误:
# 我曾把几组的年份上界写成 2013,而**本书是《BMW R1200 Twins '04 to '09》** ——
# 它根本不覆盖 2010 以后。一台 2012 camhead 会因此拿到「✅ 适用本车」。
# 上界一律不得超过 2009:适用性不能比资料本身覆盖的还宽。
book_page_formula: "书页 7•N = PDF 页 (N + 232)"

diagrams:
